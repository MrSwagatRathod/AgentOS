<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Arrow Escape — Arrow Logic Puzzle</title>
  <meta name="description" content="Only arrows with a fully open path can leave the board. Clear every arrow. Main Route, Random Play and Challenge Mode — all in your browser.">
  <meta name="theme-color" content="#ffffff" id="meta-theme">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">

    <!-- ======================= TOP BAR ======================= -->
    <header id="topbar">
      <div id="level-badge">Level 1</div>
      <div id="hearts-box" title="Hearts">
        <span class="heart-icon">♥</span><span id="hearts-text">3 / 3</span>
      </div>
      <nav id="mode-tabs">
        <button class="mode-tab" data-mode="main">Main Route</button>
        <button class="mode-tab" data-mode="random">Random Play</button>
        <button class="mode-tab" data-mode="challenge">Challenge Mode</button>
      </nav>
      <button id="btn-hint" class="pill-btn" title="Hint (H)">Hint</button>
      <div id="timer">Time <b id="time-val">05:00</b></div>
      <button id="btn-newboard" class="pill-btn" title="Load a fresh board">New Board</button>
      <button id="btn-fullscreen" class="icon-btn" title="Fullscreen (F)">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      </button>
      <button id="btn-settings" class="icon-btn" title="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </header>

    <!-- ======================= GAME CANVAS ======================= -->
    <div id="stage"><canvas id="board"></canvas></div>

    <!-- ======================= BOTTOM BAR ======================= -->
    <footer id="bottombar">
      <button id="btn-chooseboard" class="pill-btn">Choose Board</button>
      <button id="btn-restart" class="pill-btn">Restart</button>
    </footer>

    <!-- ======================= SETTINGS ======================= -->
    <div id="modal-settings" class="modal hidden">
      <div class="card settings-card">
        <div class="card-head">
          <h2>Settings</h2>
          <button id="settings-close" class="icon-btn" aria-label="Close">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>

        <div class="setting-row">
          <span class="setting-label">Display</span>
          <div class="seg" id="seg-display">
            <button data-val="mono" class="seg-btn">Mono</button>
            <button data-val="color" class="seg-btn">Color</button>
          </div>
        </div>

        <div class="setting-row">
          <span class="setting-label">Line Width</span>
          <div class="seg" id="seg-linewidth">
            <button data-val="thin" class="seg-btn">Thin</button>
            <button data-val="normal" class="seg-btn">Normal</button>
            <button data-val="bold" class="seg-btn">Bold</button>
          </div>
        </div>

        <div class="setting-row">
          <span class="setting-label">Sound</span>
          <div class="seg" id="seg-sound">
            <button data-val="off" class="seg-btn">Off</button>
            <button data-val="on" class="seg-btn">On</button>
          </div>
        </div>

        <div class="setting-row">
          <span class="setting-label">Hints</span>
          <div class="seg" id="seg-hints">
            <button data-val="off" class="seg-btn">Off</button>
            <button data-val="on" class="seg-btn">On</button>
          </div>
        </div>

        <div class="setting-row">
          <span class="setting-label">Assist Cursor</span>
          <div class="seg" id="seg-assist">
            <button data-val="off" class="seg-btn">Off</button>
            <button data-val="on" class="seg-btn">On</button>
          </div>
        </div>
      </div>
    </div>

    <!-- ======================= LEVEL SELECT (700) ======================= -->
    <div id="modal-levels" class="modal hidden">
      <div class="card levels-card">
        <div class="card-head">
          <h2 id="levels-title">Levels</h2>
          <button id="levels-close" class="icon-btn" aria-label="Close">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <p class="sub" id="now-playing">700 Levels · Now Playing: 01</p>
        <div id="level-grid"></div>
      </div>
    </div>

    <!-- ======================= CHALLENGE SELECT (25) ======================= -->
    <div id="modal-challenge" class="modal hidden">
      <div class="card challenge-card">
        <div class="card-head">
          <h2>Challenge Mode</h2>
          <button id="challenge-close" class="icon-btn" aria-label="Close">
            <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </div>
        <p class="sub">25 boards · beat the 5:00 timer. Pick a run.</p>
        <div id="challenge-grid"></div>
      </div>
    </div>

    <!-- ======================= WIN OVERLAY ======================= -->
    <div id="overlay-win" class="overlay hidden">
      <div class="card win-card">
        <div class="win-check" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 13 9 18 20 6"/></svg>
        </div>
        <h2>Level Clear!</h2>
        <p class="sub">You solved the board.</p>
        <button id="btn-assist" class="btn ghost">Enable Assist Cursor</button>
        <button id="btn-win-home" class="btn ghost">Home</button>
        <button id="btn-next" class="btn primary big">Next Level</button>
      </div>
    </div>

    <!-- ======================= LOSE OVERLAY ======================= -->
    <div id="overlay-lose" class="overlay hidden">
      <div class="card lose-card">
        <div class="lose-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </div>
        <h2 id="lose-title">Out of hearts</h2>
        <p class="sub" id="lose-sub">Collisions cost hearts. Read the board, then tap.</p>
        <button id="btn-retry" class="btn primary big">Try Again</button>
        <div class="row">
          <button id="btn-lose-home" class="btn ghost">Home</button>
          <button id="btn-lose-levels" class="btn ghost">Choose Board</button>
        </div>
      </div>
    </div>

    <!-- ======================= TOAST ======================= -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="js/puzzle.js"></script>
  <script src="js/difficulty.js"></script>
  <script src="js/hints.js"></script>
  <script src="js/renderer.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/game.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
